name: Build and Deploy to Docker Hub

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Frontend (Vite React)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.vite
          push: true
          tags: |
            izhardev/medium-frontend:latest
          #  izhardev/medium-frontend:${{ github.sha }}
          # platforms: linux/amd64,linux/arm64

      # Build and Push Socket Backend (Express)
      - name: Build and Push Socket Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./socket-backend
          file: ./socket-backend/Dockerfile.express
          push: true
          tags: |
            izhardev/socket-backend:latest
          #  izhardev/socket-backend:${{ github.sha }}
          # platforms: linux/amd64,linux/arm64

      # Verify pushed images
      - name: Verify Frontend Image
        run: |
          echo "Verifying frontend image..."
          docker pull izhardev/medium-frontend:latest
          docker images | grep medium-frontend

      - name: Verify Socket Backend Image
        run: |
          echo "Verifying socket backend image..."
          docker pull izhardev/socket-backend:latest
          docker images | grep izhardev/socket-backend

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Pull fresh images
            sudo docker pull izhardev/medium-frontend:latest
            sudo docker pull izhardev/socket-backend:latest
            sudo docker pull postgres:latest

            # Stop & remove old containers
            sudo docker stop medium-frontend || true
            sudo docker rm medium-frontend || true
            sudo docker stop socket-backend || true
            sudo docker rm socket-backend || true
            sudo docker stop medium-db || true
            sudo docker rm medium-db || true

            # Remove dangling images
            sudo docker image prune -f

            # Create a network if it doesn’t exist
            sudo docker network create app-network || true

            # Run Postgres
            sudo docker run -d \
              --name medium-db \
              --network app-network \
              -e POSTGRES_DB=medium-db \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -v postgres_data:/var/lib/postgresql/data \
              -p 5432:5432 \
              postgres:latest

            # Run Backend
            sudo docker run -d \
              --name socket-backend \
              --network app-network \
              -p 4000:4000 \
              -e NODE_ENV=production \
              -e PORT=4000 \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              -e CORS_ORIGIN=http://localhost:5173 \
              izhardev/socket-backend:latest

            # Run Frontend
            sudo docker run -d \
              --name medium-frontend \
              --network app-network \
              -p 5173:5173 \
              -e NODE_ENV=production \
              -e VITE_API_URL=http://localhost:5173 \
              izhardev/medium-frontend:latest
